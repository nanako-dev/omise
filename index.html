<head>

<style>
  body { margin:0; background:#f6e9d2; font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; color:#5b4a3e; }

  a.shop span { font-size:12px; color:#8a6f5e; line-height:1.5; }

  .soon b::after { content:'  準備中'; font-size:11px; color:#c9553d; }

<main>

  <a class="shop soon" href="#"><div class="ic" style="background:#fbeef5">🍬</div><div><b>わたあめ屋さん</b><span>糸が巻き付いてふくらむ。</span></div></a>
