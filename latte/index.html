    <b>2 スチーム</b>：マシン右の銀のノズルを長押し (2〜4秒)<br>
    <b>3 注ぐ</b>：手前のピッチャーをタップして持ち、カップを指で押さえたまま動かす<br>
    <b>4 模様</b>：左右に小さくふりながら手前へ引き、最後にまっすぐ通す<br>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= fluid simulation (カップの表面) =================
// N×N の格子。u,v = 表面の流れ (マス/秒)、w = 白さ (ミルクの泡 0..1)。カップの外 (mask=0) は壁。
// 注ぐ: 白を足して外向きに押す + 指の動きの向きに流す。ピック: 細く強い流れだけ。流れが白と茶色を運んで模様になる。
const N = 200, NN = N * N, CUP_R = .8; // world: カップ半径 (形は半径 1 で作って CUP_R 倍に縮める) = N/2 マス
const u = new Float32Array(NN), v = new Float32Array(NN), pu = new Float32Array(NN), pv = new Float32Array(NN), u0 = new Float32Array(NN), v0 = new Float32Array(NN), w = new Float32Array(NN), w0 = new Float32Array(NN), w1 = new Float32Array(NN), pr = new Float32Array(NN), dv = new Float32Array(NN), noise = new Float32Array(NN), mask = new Uint8Array(NN);

function cellOf(x, z) { const i = Math.floor((x / CUP_R + 1) * .5 * N), j = Math.floor((z / CUP_R + 1) * .5 * N); return i < 0 || j < 0 || i >= N || j >= N ? -1 : j * N + i; }
function advect(dst, src, dt, push) { // push: 注ぎ口の押し出し (発散する流れなので圧力計算の外で白だけを運ぶ)
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (!mask[k]) { dst[k] = src[k]; continue; }
    let x = i - dt * (u[k] + (push ? pu[k] : 0)), y = j - dt * (v[k] + (push ? pv[k] : 0)); if (x < .5) x = .5; if (x > N - 1.5) x = N - 1.5; if (y < .5) y = .5; if (y > N - 1.5) y = N - 1.5;

    const ka = mask[a] ? src[a] : src[k], kb = mask[a + 1] ? src[a + 1] : src[k], kc = mask[a + N] ? src[a + N] : src[k], kd = mask[a + N + 1] ? src[a + N + 1] : src[k];

    const ur = mask[k + 1] ? u[k + 1] : 0, ul = mask[k - 1] ? u[k - 1] : 0, vd = mask[k + N] ? v[k + N] : 0, vu = mask[k - N] ? v[k - N] : 0; dv[k] = -.5 * (ur - ul + vd - vu); }

    const a = mask[k - 1] ? pr[k - 1] : pr[k], b = mask[k + 1] ? pr[k + 1] : pr[k], c = mask[k - N] ? pr[k - N] : pr[k], d = mask[k + N] ? pr[k + N] : pr[k]; pr[k] = (dv[k] + a + b + c + d) * .25; }
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (!mask[k]) continue;
    const a = mask[k - 1] ? pr[k - 1] : pr[k], b = mask[k + 1] ? pr[k + 1] : pr[k], c = mask[k - N] ? pr[k - N] : pr[k], d = mask[k + N] ? pr[k + N] : pr[k]; u[k] -= .5 * (b - a); v[k] -= .5 * (d - c); }

function fluidStep(dt) {

  advect(u0, u, dt); advect(v0, v, dt); u.set(u0); v.set(v0); project();

  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (!mask[k]) continue; let c = w0[k] + (w[k] - w1[k]) * .5; const a = w[k - 1], b = w[k + 1], cc = w[k - N], d = w[k + N], e = w[k]; const lo = Math.min(a, b, cc, d, e), hi = Math.max(a, b, cc, d, e); w1[k] = c < lo ? lo : c > hi ? hi : c; }

    for (let j = 1; j < N - 1; j += 2) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (mask[k]) w[k] += ((w[k - 1] + w[k + 1] + w[k - N] + w[k + N]) * .25 - w[k]) * dt * 1.2; } }
}
function splatVel(x, z, r, fx, fz, radial, dt) { // r は world。fx,fz = 流れ (マス/秒)、radial = 外向きの押し
  const ci = (x / CUP_R + 1) * .5 * N, cj = (z / CUP_R + 1) * .5 * N, rc = r * W2C, R2 = rc * rc * 4;
  const i0 = Math.max(1, Math.floor(ci - rc * 2)), i1 = Math.min(N - 2, Math.ceil(ci + rc * 2)), j0 = Math.max(1, Math.floor(cj - rc * 2)), j1 = Math.min(N - 2, Math.ceil(cj + rc * 2));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const k = j * N + i; if (!mask[k]) continue; const dx = i - ci, dz = j - cj, d2 = dx * dx + dz * dz; if (d2 > R2) continue; const wgt = Math.exp(-d2 / (rc * rc)); const d = Math.sqrt(d2) + .3;
    u[k] += fx * wgt * dt; v[k] += fz * wgt * dt; pu[k] += radial * dx / d * wgt; pv[k] += radial * dz / d * wgt; }

function splatW(x, z, r, amt, dt) { const ci = (x / CUP_R + 1) * .5 * N, cj = (z / CUP_R + 1) * .5 * N, rc = r * W2C; const i0 = Math.max(1, Math.floor(ci - rc * 2)), i1 = Math.min(N - 2, Math.ceil(ci + rc * 2)), j0 = Math.max(1, Math.floor(cj - rc * 2)), j1 = Math.min(N - 2, Math.ceil(cj + rc * 2));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const k = j * N + i; if (!mask[k]) continue; const dx = i - ci, dz = j - cj, d2 = dx * dx + dz * dz; const wgt = Math.exp(-d2 / (rc * rc)); if (wgt < .02) continue; w[k] = Math.min(1, Math.max(0, w[k] + amt * wgt * dt)); } }
// 注ぎ口: ゆっくりなら白が真下にも浮く。速く動かすと真下は下から湧く茶色 (新しい液面) で、白はその周りに輪で出る → ふると葉が分かれる
function pourSplat(x, z, rc, amt, slow, dt) { const ci = (x / CUP_R + 1) * .5 * N, cj = (z / CUP_R + 1) * .5 * N, r = rc * W2C; const i0 = Math.max(1, Math.floor(ci - r * 2.6)), i1 = Math.min(N - 2, Math.ceil(ci + r * 2.6)), j0 = Math.max(1, Math.floor(cj - r * 2.6)), j1 = Math.min(N - 2, Math.ceil(cj + r * 2.6));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const k = j * N + i; if (!mask[k]) continue; const dx = i - ci, dz = j - cj, d = Math.sqrt(dx * dx + dz * dz); const core = Math.exp(-d * d / (r * r)), ring = Math.exp(-(d - r * 1.4) * (d - r * 1.4) / (r * r * .7));
    const add = amt * (ring + core * slow) * dt; const fresh = (1 - slow) * 70 * Math.exp(-d * d / (r * r * .6)) * dt; w[k] = Math.min(1, Math.max(0, w[k] + add - w[k] * fresh)); } }
function stats() {
  let n = 0, white = 0, edge = 0; for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (!mask[k]) continue; n++; white += w[k]; if (mask[k + 1]) edge += Math.abs(w[k + 1] - w[k]); if (mask[k + N]) edge += Math.abs(w[k + N] - w[k]); }
  return { white: white / n, edge: edge / n, fill: g.fill, foam: g.foam, cremaAge: g.cremaAge, spill: g.spill, cocoa: g.cocoa };
}

// ================= game state =================
let g;
function newLatte() {
  u.fill(0); v.fill(0); w.fill(0);
  g = { phase: 'make', t: 0, fill: 0, brewing: 0, crema: 0, cremaAge: 0, steamT: 0, foam: null, steaming: false, tool: null, pointer: null, down: false, lastP: null, speed: 0, spill: 0, cocoa: 0, msgT: 0, msgCool: 0, photo: null, poured: 0 };
  resetPresentation(); setHeld(null); say('まずマシンのボタンをタップして、エスプレッソを淹れてね');
  document.getElementById('b-done').classList.add('off');
}
function say(t, mood = 'normal') { document.getElementById('say').textContent = t; g.msgT = 0; drawCat(mood); }
function simulate(dt) {
  if (g.brewing > 0) { g.brewing -= dt; g.fill = Math.min(.42, g.fill + dt * .14); if (g.brewing <= 0) { g.crema = 1; g.cremaAge = 0; say('クレマができた。次はミルクをスチーム。ノズルを長押しだよ'); } }

  try { const t = document.createElement('canvas'); t.width = 150; t.height = 200; const tx = t.getContext('2d'); const src = renderer.domElement; const sw = src.width, shh = Math.min(src.height, sw * 200 / 150); tx.drawImage(src, 0, (src.height - shh) * .35, sw, shh, 0, 0, 150, 200); const arr = JSON.parse(localStorage.getItem('latte-gallery') || '[]'); arr.unshift(t.toDataURL('image/jpeg', .7)); while (arr.length > 12) arr.pop(); localStorage.setItem('latte-gallery', JSON.stringify(arr)); } catch (e) {}
}
function openGallery() {
  let arr = []; try { arr = JSON.parse(localStorage.getItem('latte-gallery') || '[]'); } catch (e) {}
  const grid = document.getElementById('g-grid'); grid.innerHTML = ''; arr.forEach(src => { const im = document.createElement('img'); im.src = src; grid.appendChild(im); });
  document.getElementById('g-empty').classList.toggle('hidden', arr.length > 0); document.getElementById('gallery').classList.remove('hidden');
}

// ================= buttons =================
document.getElementById('start').onclick = () => { ensureAudio(); track('latte_start'); document.getElementById('title').classList.add('hidden'); newLatte(); };
document.getElementById('again').onclick = () => { document.getElementById('result').classList.add('hidden'); newLatte(); };
document.getElementById('b-reset').onclick = () => { document.getElementById('result').classList.add('hidden'); newLatte(); sfx.tap(); };
document.getElementById('b-done').onclick = () => { if (g.phase !== 'make') return; if (g.fill >= .9) finish(); else say(g.fill >= .4 ? 'カップがいっぱいになるまで注いでから' : 'エスプレッソを淹れて、ミルクを注いでから「できた」だよ'); };
document.getElementById('b-gallery').onclick = openGallery;
document.getElementById('held').onclick = () => { setHeld(null); say('手ぶら'); sfx.tap(); };
document.getElementById('g-close').onclick = () => document.getElementById('gallery').classList.add('hidden');
document.getElementById('save').onclick = () => { track('latte_save'); render(); const a = document.createElement('a'); a.download = 'latte-' + Date.now() + '.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); };
document.getElementById('share').onclick = () => { track('latte_share'); const t = `ラテアート屋さんで作ったよ ☕ ${g.photo ? g.photo.msg : ''} #ラテアート屋さん`; open('https://x.com/intent/post?text=' + encodeURIComponent(t) + '&url=' + encodeURIComponent(location.href.split('?')[0]), '_blank'); };

newLatte(); g.phase = 'title';
document.getElementById('loading').remove();
requestAnimationFrame(frame);
// ---- 公開用サムネイル (?og=1 / ?og=icon): ロゼッタを注いで写真の構図で止める
const OG = new URLSearchParams(location.search).get('og');
function demoPour() { // 左右にふりながら手前に引いて、最後にまっすぐ通す
  g.brewing = 3; for (let i = 0; i < 200; i++) update(1 / 60); g.foam = 'fine'; g.steamT = 3; setHeld({ kind: 'tool', id: 'pitcher', name: 'ピッチャー' });
  const step = (x, z, n) => { for (let i = 0; i < n; i++) { g.pointer = { x, z }; g.down = true; update(1 / 60); } };
  step(0, .15, 70); // 中心に注いでベースを作る
  for (let i = 0; i < 240; i++) { const t = i / 240; g.pointer = { x: Math.sin(t * Math.PI * 2 * 5.5) * .16, z: .3 - t * .72 }; g.down = true; update(1 / 60); } // wiggle backward (5〜6 回 = 葉の数)
  for (let i = 0; i < 26; i++) { g.pointer = { x: 0, z: -.6 + i * .05 }; g.down = true; update(1 / 60); } // pull through
  g.down = false; g.pointer = null; for (let i = 0; i < 40; i++) update(1 / 60);
}
if (OG) { document.body.classList.add('og'); newLatte(); g.phase = 'make'; demoPour();
  const cam = OG === 'icon' ? { pos: [0, 2.2, 1.6], look: [0, .1, .1] } : { pos: [.5, 2.0, 2.2], look: [0, .1, .15] };
  CAM.photo.pos.fromArray(cam.pos); CAM.photo.look.fromArray(cam.look); finish(); camera.position.copy(CAM.photo.pos); camera.lookAt(CAM.photo.look); update(0); render(); }
window.__g = () => g; window.__api = { CAM, LAYOUT, applyLayout, resize, pickAt, worldAt, pickables, update, render, stats, newLatte, setHeld, finish, demoPour, simulate, camera, scene, renderer, THREE, u, v, w, N, machine, brewBtn, wand, pitcherRack };
