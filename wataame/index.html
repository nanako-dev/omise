<meta name="description" content="ざらめを入れて、あたたまったら棒でくるくる。回し方で形が決まり、ざらめの順番で色が層になる、本物みたいなわたあめ屋さん。">
<meta property="og:title" content="わたあめ屋さん">
<meta property="og:description" content="ざらめを入れて、棒でくるくる巻いて、ふわふわのわたあめを作ろう。">
<style>
  :root { color-scheme: light; --cream:#fff8f3; --pink:#f6b9c7; --pink2:#fde7ec; --berry:#ef7f9a; --cocoa:#7a4a3a; --ink:#6b5047; --shadow:0 4px 14px rgba(190,120,130,.22); }
  html, body { margin:0; height:100%; background:#fbe6ec; overflow:hidden; font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c","Noto Sans JP",-apple-system,sans-serif; font-weight:700; touch-action:none; -webkit-user-select:none; user-select:none; }

  .pill { display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--cocoa); font-size:13px; font-weight:900; padding:10px 15px; border-radius:24px; border:0; box-shadow:var(--shadow), inset 0 -3px 0 rgba(120,70,70,.06); white-space:nowrap; cursor:pointer; transition:transform .08s; font-family:inherit; }
  .pill:active { transform:translateY(2px); }
  .pill.cta { background:linear-gradient(#f7a3b8, #ec7a97); color:#fff; box-shadow:0 5px 14px rgba(236,122,151,.4), inset 0 -3px 0 rgba(0,0,0,.08); }
  .pill.off { background:#f7eef0; color:#cdb3b8; box-shadow:none; }
  .pill svg { width:16px; height:16px; }
  .spacer { flex:1; }
  #guide { position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 62px); z-index:3; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:5px; background:#fff; border-radius:22px; padding:9px 18px 8px; box-shadow:var(--shadow); }
  #guide-t { font-size:14px; font-weight:900; color:var(--cocoa); white-space:nowrap; }
  #guide .dots { display:flex; gap:5px; }

  #guide .dots i.done { background:var(--pink); }
  #status { position:fixed; left:12px; top:calc(env(safe-area-inset-top) + 124px); display:flex; flex-direction:column; gap:6px; z-index:3; pointer-events:none; }
  #status span { display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.9); color:var(--cocoa); font-size:11px; font-weight:900; padding:5px 10px; border-radius:14px; box-shadow:var(--shadow); width:max-content; }
  #status svg { width:13px; height:13px; }
  #staff { position:fixed; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 12px); display:flex; align-items:flex-end; gap:8px; z-index:3; pointer-events:none; }

  #say { position:relative; background:#fff; border-radius:22px; padding:12px 16px; font-size:14px; font-weight:900; line-height:1.5; color:var(--cocoa); box-shadow:var(--shadow); min-height:18px; flex:1; margin-bottom:12px; }
  #say::after { content:''; position:absolute; left:-9px; bottom:18px; border:8px solid transparent; border-right-color:#fff; }
  #held { position:fixed; right:10px; bottom:calc(env(safe-area-inset-bottom) + 104px); z-index:3; display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--pink); border-radius:18px; padding:6px 12px 6px 6px; box-shadow:var(--shadow); cursor:pointer; font-family:inherit; }
  #held canvas { width:38px; height:38px; background:var(--pink2); border-radius:12px; }

  .panel p { margin:6px 0; font-size:13px; line-height:1.55; color:var(--ink); }

  button.big { margin-top:10px; width:100%; border:0; background:linear-gradient(#f7a3b8, #ec7a97); color:#fff; font-size:18px; font-weight:900; padding:14px; border-radius:30px; box-shadow:0 6px 16px rgba(236,122,151,.4), inset 0 -4px 0 rgba(0,0,0,.08); cursor:pointer; font-family:inherit; }

<div id="top" class="ui">
  <button class="pill" id="b-gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>作品</button>
  <div class="spacer"></div>

  <span id="s-heat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 1-2 0-5 1-9z"/></svg><em id="s-heat-t">冷たい</em></span>

</div>

<div id="staff"><canvas id="cat" width="144" height="144"></canvas><div id="say">…</div></div>

<div id="title" class="panel">
  <h1>わたあめ屋さん</h1>
  <p>糸が本当に釜のふちにたまって、<br>棒に巻きついてふくらみます。</p>
  <div class="howto">
    <b>ざらめ</b>：瓶をタップしてスプーンにのせ、釜のまんなかに注ぐ<br>
    <b>待つ</b>：あたたまると糸が飛びはじめる<br>
    <b>棒</b>：ふちに沿ってくるくる。回し方で形が決まる<br>
    <b>色</b>：別のざらめを足すと、外側に色が重なる<br>
    まんなかに近づけすぎると溶けちゃう → できたら「できた」
  </div>
  <button class="big" id="start">はじめる</button>
</div>
<div id="result" class="panel hidden">
  <h1>できあがり！</h1>
  <p id="r-msg"></p>
  <div class="row"><button class="big" id="again">↻ もうひとつ作る</button></div>
  <div class="row"><button class="sub" id="save">画像を保存</button><button class="sub" id="share">Xでシェア</button></div>
</div>
<div id="gallery" class="panel hidden">
  <h1>過去の作品</h1>
  <div class="grid" id="g-grid"></div>
  <p id="g-empty" class="hidden">まだ作品がありません</p>
  <button class="sub" id="g-close">とじる</button>
</div>

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= simulation =================
// 釜のふちの糸: NR マス (量 F、色 FC、たまってからの時間 Fage = 時間がたつとしっとりして「ふわふわ」が落ちる)
// 棒の綿: 棒のまわりの角度 NT × 高さ NY の場 (量 m、色 c、ふわふわ f)。指の動きで巻きつく場所が決まる
const NR = 36, NT = 32, NY = 12;
const SUGARS = [
  { id: 'ichigo', name: 'いちご', col: '#ff86a8' }, { id: 'soda', name: 'ソーダ', col: '#74c6ff' }, { id: 'lemon', name: 'レモン', col: '#ffd75c' },
  { id: 'budo', name: 'ぶどう', col: '#b58ae8' }, { id: 'melon', name: 'メロン', col: '#86dc94' },
];
const RIM_R = .86;      // 糸がたまる半径
const STICK_R = .028;
let g;
function newCandy() {
  g = { phase: 'make', t: 0, sugar: 0, sugarCol: new THREE.Color('#ffffff'), heat: 0, emitAng: 0,
    F: new Float32Array(NR), FC: new Float32Array(NR * 3).fill(1), Fage: new Float32Array(NR),
    m: new Float32Array(NT * NY), c: new Float32Array(NT * NY * 3).fill(1), cs: new Float32Array(NT * NY * 3).fill(1), f: new Float32Array(NT * NY),
    spin: 0, tool: null, spoon: null, pointer: null, down: false, lastP: null, speed: 0, melted: 0, colors: new Set(), mass: 0, collected: 0,
    msgT: 0, msgCool: 0, photo: null, stick: { x: 0, z: 0, y: .55, in: false } };
  resetPresentation(); setHeld(null); say('まず、ざらめの瓶をタップしてスプーンにのせてね');
  document.getElementById('b-done').classList.add('off');
}
function say(t, mood = 'normal') { document.getElementById('say').textContent = t; g.msgT = 0; drawCat(mood); }
function mix3(arr, i, col, k) { arr[i * 3] += (col.r - arr[i * 3]) * k; arr[i * 3 + 1] += (col.g - arr[i * 3 + 1]) * k; arr[i * 3 + 2] += (col.b - arr[i * 3 + 2]) * k; }
function simulate(dt) {
  // 釜の熱
  g.heat = Math.max(0, Math.min(1, g.heat + (g.sugar > 0 ? dt / 2.6 : -dt / 4)));
  const emitting = g.heat >= 1 && g.sugar > 0;
  if (emitting) {
    g.emitAng += dt * 5.5; const rate = .5 * dt; g.sugar = Math.max(0, g.sugar - rate * .75);
    const center = g.emitAng / (Math.PI * 2) * NR; let ws = 0; const w = []; for (let k = -3; k <= 3; k++) { w[k + 3] = Math.exp(-k * k / 3); ws += w[k + 3]; }
    for (let k = -3; k <= 3; k++) { const i = ((Math.round(center) + k) % NR + NR) % NR; const add = rate * w[k + 3] / ws; const F0 = g.F[i]; g.F[i] = Math.min(1.5, F0 + add); const fr = add / (F0 + add); mix3(g.FC, i, g.sugarCol, fr); g.Fage[i] *= (1 - fr); }
  }
  for (let i = 0; i < NR; i++) if (g.F[i] > .02) g.Fage[i] += dt;
  // 棒
  const s = g.stick;
  if (g.tool === 'stick' && g.down && g.pointer) {
    s.in = true; const tx = g.pointer.x, tz = g.pointer.z; const dx = tx - s.x, dz = tz - s.z; const d = Math.hypot(dx, dz);
    g.speed += (d / Math.max(dt, 1e-3) - g.speed) * .3; s.x = tx; s.z = tz; s.y += (.05 - s.y) * .25;
    g.spin += dt * 2 + g.speed * 7 * dt;
    const r = Math.hypot(s.x, s.z), phi = Math.atan2(s.z, s.x);
    if (r > .5 && r < 1.08) {
      const center = phi / (Math.PI * 2) * NR; let take = 0; const col = new THREE.Color(0, 0, 0); let fl = 0;
      for (let k = -2; k <= 2; k++) { const i = ((Math.round(center) + k) % NR + NR) % NR; const w = Math.exp(-k * k / 2.2); const t = Math.min(g.F[i], g.F[i] * dt * 3.4 * (.35 + Math.min(1, g.speed / .55)) * w); if (t <= 0) continue; g.F[i] -= t; take += t; col.r += g.FC[i * 3] * t; col.g += g.FC[i * 3 + 1] * t; col.b += g.FC[i * 3 + 2] * t; fl += (1 - Math.min(1, g.Fage[i] / 28)) * t; }
      if (take > 1e-5) {
        col.multiplyScalar(1 / take); fl /= take; g.collected += take;
        const th0 = (phi - g.spin) / (Math.PI * 2) * NT; let ws = 0; const wt = [], wy = [];
        for (let i = -4; i <= 4; i++) wt[i + 4] = Math.exp(-i * i / 5); for (let j = 0; j < NY; j++) { wy[j] = Math.exp(-(j - NY * .47) * (j - NY * .47) / 24); } for (let i = 0; i < 9; i++) for (let j = 0; j < NY; j++) ws += wt[i] * wy[j];
        for (let i = -4; i <= 4; i++) { const ti = ((Math.round(th0) + i) % NT + NT) % NT; for (let j = 0; j < NY; j++) { const add = take * wt[i + 4] * wy[j] / ws; const k = ti * NY + j; const m0 = g.m[k]; g.m[k] = m0 + add; const fr = add / (m0 + add); mix3(g.c, k, col, fr); mix3(g.cs, k, col, add / (add + m0 * .1)); g.f[k] += (fl - g.f[k]) * fr; } }
        const near = SUGARS.find(q => { const qc = new THREE.Color(q.col); return Math.hypot(qc.r - col.r, qc.g - col.g, qc.b - col.b) < .22; }); if (near) g.colors.add(near.id);
        if (Math.random() < .25) sfx.whir();
      }
    }
    // まんなかに近いと溶ける
    if (r < .34 && g.heat > .4 && g.mass > .01) { for (let k = 0; k < NT * NY; k++) { g.m[k] *= 1 - dt * .55; g.cs[k * 3] *= 1 - dt * .12; g.cs[k * 3 + 1] *= 1 - dt * .18; g.cs[k * 3 + 2] *= 1 - dt * .2; } g.melted += dt; if (g.msgCool <= 0) { say('あつっ！まんなかは熱いよ、ふちで巻いてね', 'oops'); g.msgCool = 2.5; } }
  } else if (g.tool === 'stick') { s.in = false; g.speed *= .9; s.y += (.55 - s.y) * .12; g.spin += dt * .8; }
  // スプーンで注ぐ
  if (g.tool === 'spoon' && g.spoon && g.down && g.pointer) {
    const r = Math.hypot(g.pointer.x, g.pointer.z);
    if (r < .42 && g.spoon.amt > 0) { const p = Math.min(g.spoon.amt, dt * .55); g.spoon.amt -= p; const S0 = g.sugar; g.sugar += p; g.sugarCol.lerp(new THREE.Color(g.spoon.col), p / (S0 + p)); if (Math.random() < .5) sfx.pour(); if (g.spoon.amt <= 0) { say(g.heat >= 1 ? '糸が飛んでる！棒でふちをくるくる' : 'あたたまるまでちょっと待ってね'); } }
  }
  let mass = 0; for (let k = 0; k < NT * NY; k++) mass += g.m[k]; g.mass = mass;
}
function stats() {
  const prof = new Float32Array(NT); let tot = 0; for (let i = 0; i < NT; i++) { let s = 0; for (let j = 0; j < NY; j++) s += g.m[i * NY + j]; prof[i] = s; tot += s; }
  const mean = tot / NT; let v = 0; for (let i = 0; i < NT; i++) v += (prof[i] - mean) ** 2; const sd = Math.sqrt(v / NT);
  let fl = 0; for (let k = 0; k < NT * NY; k++) fl += g.f[k] * g.m[k];
  return { mass: tot, round: tot > 0 ? Math.max(0, 1 - sd / (mean + 1e-6)) : 0, fluff: tot > 0 ? fl / tot : 0, colors: g.colors.size, melted: g.melted };
}

// ================= audio =================
let AC = null;
function ensureAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', vol = .06, slide = 0) { if (!AC) return; const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.linearRampToValueAtTime(f + slide, AC.currentTime + d); gn.gain.value = vol; gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); }
function noiseBurst(d, vol = .03) { if (!AC) return; const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), dd = b.getChannelData(0); for (let i = 0; i < n; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(); s.buffer = b; const gn = AC.createGain(); gn.gain.value = vol; s.connect(gn); gn.connect(AC.destination); s.start(); }
const sfx = { tap: () => tone(520, .08, 'triangle', .05), whir: () => noiseBurst(.12, .012), pour: () => noiseBurst(.08, .02), done: () => { tone(660, .12); setTimeout(() => tone(880, .12), 100); setTimeout(() => tone(1100, .3), 200); } };

// ================= assets (shared Blender GLB from the crepe shop) =================
const A = await new Promise(res => { new GLTFLoader().load('../crepe/assets.glb?v=6', gltf => { const lib = {}; gltf.scene.children.slice().forEach(ch => { lib[ch.name] = ch; }); res(lib); }, undefined, err => { console.warn('assets.glb failed', err); res(null); }); });
function asset(name) { const src = A && A[name]; if (!src) return null; const c = new THREE.Group(); c.add(src.clone()); c.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return c; }

// ================= three.js scene =================
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#fbe6ec'); scene.fog = new THREE.Fog('#fbe6ec', 7.5, 13);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture; scene.environmentIntensity = .6;
const camera = new THREE.PerspectiveCamera(50, 1, .1, 50);
const CAM = { make: { pos: new THREE.Vector3(.26, 4.2, 3.4), look: new THREE.Vector3(.26, .05, .3) }, photo: { pos: new THREE.Vector3(0, 1.05, 3.1), look: new THREE.Vector3(0, .72, 0) } };
camera.position.copy(CAM.make.pos); camera.lookAt(CAM.make.look);
const camState = { pos: CAM.make.pos.clone(), look: CAM.make.look.clone() };
const hemi = new THREE.HemisphereLight('#fff6f8', '#e8cbb8', .55); scene.add(hemi);
