<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= simulation grid =================
const N = 120, T = 0.03, ZS = 0.06;           // cells, layer thickness, height scale
const NB = [-1, 1, -N, N, -N - 1, -N + 1, N - 1, N + 1], NBW = [1, 1, 1, 1, .7, .7, .7, .7];
const h = new Float32Array(N * N), c = new Float32Array(N * N), c2 = new Float32Array(N * N), dh = new Float32Array(N * N);
const noise = new Float32Array(N * N), blocked = new Uint8Array(N * N);
const gxOf = i => -1 + 2 * i / (N - 1), gzOf = j => -1 + 2 * j / (N - 1);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) blocked[j * N + i] = Math.hypot(gxOf(i), gzOf(j)) > .985 ? 1 : 0;
(function () {
  const raw = new Float32Array(N * N); for (let k = 0; k < N * N; k++) raw[k] = Math.random();
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { let s = 0, n = 0; for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) { const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= N || jj >= N) continue; s += raw[jj * N + ii]; n++; } noise[j * N + i] = s / n; }
  let mn = 1, mx = 0; for (let k = 0; k < N * N; k++) { mn = Math.min(mn, noise[k]); mx = Math.max(mx, noise[k]); }
  for (let k = 0; k < N * N; k++) noise[k] = (noise[k] - mn) / (mx - mn);
})();
const cellAt = (x, z) => { const i = Math.round((x + 1) * (N - 1) / 2), j = Math.round((z + 1) * (N - 1) / 2); return (i < 0 || j < 0 || i >= N || j >= N) ? -1 : j * N + i; };
const CELLW = 2 / (N - 1);

// ================= game state =================
let g;
const SUBS = {
  cream: [{ id: 'white', name: 'ホイップ', col: '#fffdf7' }, { id: 'choco', name: 'チョコクリーム', col: '#7a4a2e' }, { id: 'matcha', name: '抹茶クリーム', col: '#9fbf6a' }, { id: 'ichigo', name: 'いちごクリーム', col: '#f6bfcf' }],
  sauce: [{ id: 'choco', name: 'チョコソース', col: '#4a2a18' }, { id: 'ichigo', name: 'いちごソース', col: '#d8324a' }, { id: 'caramel', name: 'キャラメル', col: '#c47a2a' }, { id: 'custard', name: 'カスタード', col: '#f2c34a' }],
  fruit: [{ id: 'ichigo', name: 'いちご' }, { id: 'banana', name: 'バナナ' }, { id: 'kiwi', name: 'キウイ' }, { id: 'mikan', name: 'みかん' }, { id: 'blueberry', name: 'ブルーベリー' }, { id: 'chip', name: 'チョコチップ' }],
};
function newCrepe() {
  h.fill(0); c.fill(0); c2.fill(0); resetMarks();
  if (g) { g.items.forEach(it => it.mesh && crepeGroup.remove(it.mesh)); }
  g = { phase: 'cook', tool: null, sub: null, t: 0, ml: 0, flipped: false, fold: 0, folds: [], foldAnim: null, flipAnim: null, smoke: 0,
    items: [], dragItem: null, pointer: null, last: null, path: [], msgT: 0, msgCool: 0, torn: 0, stats: null, photo: null };
  resetPresentation();
  say('棚からおたまを取って、鉄板に生地を落としてね');
  setHeld(null);
}
function say(t, mood = 'normal') { document.getElementById('say').textContent = t; g.msgT = 0; drawCat(mood); }
function stats() {
  let n = 0, sumH = 0, sumC = 0, thin = 0, thick = 0, burnt = 0, raw = 0, holes = 0, maxC = 0, R = 0;
  for (let k = 0; k < N * N; k++) {
    if (blocked[k] || h[k] <= .02) continue;
    n++; sumH += h[k]; sumC += c[k]; maxC = Math.max(maxC, c[k], c2[k]); if (h[k] < .2) thin++; if (h[k] > .6) thick++; if (c[k] > 1.15 || c2[k] > 1.15) burnt++; if (c[k] < .3) raw++;
    const i = k % N, j = (k - i) / N; R = Math.max(R, Math.hypot(gxOf(i), gzOf(j)));
  }
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (blocked[k] || h[k] > .02) continue; let nb = 0; if (h[k - 1] > .02) nb++; if (h[k + 1] > .02) nb++; if (h[k - N] > .02) nb++; if (h[k + N] > .02) nb++; if (nb >= 3) holes++; }
  const area = n / (Math.PI * (N / 2 - 1.5) ** 2);
  return { n, area, avgH: n ? sumH / n : 0, avgC: n ? sumC / n : 0, thinR: n ? thin / n : 0, thickR: n ? thick / n : 0, burnt, rawR: n ? raw / n : 0, holes, maxC, R };
}
function simulate(dt) {
  if (g.fold > 0 || g.foldAnim || g.flipAnim) return;
  dh.fill(0);
  const yieldH = .22, kf = Math.min(.22, dt * 13);
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const k = j * N + i; if (blocked[k]) continue; const hk = h[k]; if (hk <= yieldH) continue;
    const rawness = Math.max(0, 1 - c[k] / .4); if (rawness <= 0) continue;
    const ex = (hk - yieldH) * kf * rawness; let wsum = 0;
    for (let q = 0; q < 8; q++) { const idx = k + NB[q]; if (!blocked[idx] && h[idx] < hk) wsum += NBW[q]; }
    if (!wsum) continue;
    for (let q = 0; q < 8; q++) { const idx = k + NB[q]; if (!blocked[idx] && h[idx] < hk) dh[idx] += ex * NBW[q] / wsum; }
    dh[k] -= ex;
  }
  for (let k = 0; k < N * N; k++) if (dh[k]) h[k] += dh[k];
  // gentle levelling of raw batter (ripples settle)
  const ks = Math.min(.12, dt * 2.5);
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) { const k = j * N + i; if (blocked[k] || h[k] <= .05 || c[k] > .4) { dh[k] = 0; continue; } let sum = 0, n = 0; for (let q = 0; q < 4; q++) { const idx = k + NB[q]; if (!blocked[idx] && h[idx] > .05) { sum += h[idx]; n++; } } dh[k] = n === 4 ? (sum / 4 - h[k]) * ks * (1 - c[k] / .4) : 0; }
  for (let k = 0; k < N * N; k++) if (dh[k]) { h[k] += dh[k]; dh[k] = 0; }
  const base = .045 * dt; let smoke = 0;
  for (let k = 0; k < N * N; k++) {
    if (blocked[k] || h[k] <= .02) continue;
    const rate = base * (.75 + .5 * noise[k]) * (.7 + .6 * (1 - Math.min(h[k], .8) / .8));
    if (!g.flipped) { c[k] = Math.min(1.6, c[k] + rate); if (c[k] > 1.15) smoke++; }
    else { c2[k] = Math.min(1.6, c2[k] + rate); if (c2[k] > 1.15) smoke++; }
  }
  g.smoke = smoke;
}
function pour(x, z, dt) {
  const k0 = cellAt(x, z); if (k0 < 0) return;
  const ci = k0 % N, cj = (k0 - ci) / N, R = 7; const amt = 900 * dt; let n = 0;
  for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) { if (di * di + dj * dj > R * R) continue; const ii = ci + di, jj = cj + dj; if (ii < 0 || jj < 0 || ii >= N || jj >= N) continue; if (!blocked[jj * N + ii]) n++; }
  if (!n) return;
  for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) { const d2 = di * di + dj * dj; if (d2 > R * R) continue; const ii = ci + di, jj = cj + dj; if (ii < 0 || jj < 0 || ii >= N || jj >= N) continue; const k = jj * N + ii; if (blocked[k]) continue; h[k] += amt * (1 - d2 / (R * R) * .5) / n; c[k] = Math.min(c[k], .12); if (g.flipped) c2[k] = Math.min(c2[k], .12); }
  g.ml += amt / 24;
}
function spread(p0, p1) {
  const dx = p1.x - p0.x, dz = p1.z - p0.z, len = Math.hypot(dx, dz); if (len < .002) return;
  const ux = dx / len, uz = dz / len, nx = -uz, nz = ux; const L = .2;
  const steps = Math.ceil(len / (CELLW * .8)); let torn = 0;
  for (let s = 0; s <= steps; s++) {
    const bx = p0.x + dx * s / steps, bz = p0.z + dz * s / steps;
    for (let o = -L; o <= L; o += CELLW * .9) {
      const px = bx + nx * o, pz = bz + nz * o; const k = cellAt(px, pz); if (k < 0 || blocked[k] || h[k] <= 0) continue;
      if (c[k] < .45) {
        if (h[k] > .3) { const ex = h[k] - .3; h[k] = .3; let given = 0; for (let q = 1; q <= 5; q++) { const a1 = cellAt(px + ux * CELLW * (q + 1.2), pz + uz * CELLW * (q + 1.2)); const w = [.3, .25, .2, .15, .1][q - 1]; if (a1 >= 0 && !blocked[a1]) { h[a1] += ex * w; given += w; } } }
        else if (h[k] < .11 && Math.random() < .3) { h[k] = 0; torn++; }
      } else if (Math.random() < .08) { h[k] = 0; torn++; }
    }
  }
  // relax ridges left behind the bar
  relaxRaw(p1.x, p1.z, .32);
  drawMark(p0, p1, nx, nz, L);
  if (torn > 0) g.torn += torn;
  if (torn > 12 && g.msgCool <= 0 && Math.random() < .5) { say(stats().avgC > .45 ? 'もう焼けてる。のばすと破れるよ' : '薄すぎて穴があいた…生地を足して埋めよう', 'oops'); g.msgCool = 3; sfx.rip(); }
}
